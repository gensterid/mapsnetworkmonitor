<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Map Visualization</title>
  <!-- Preload Critical Fonts (Prevents FOUT/Layout Shifts) -->
  <link rel="preload" href="/fonts/material-symbols-outlined.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="/fonts/inter-400.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="/fonts/inter-500.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="/fonts/inter-600.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <!-- Local Fonts -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B1120" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Pre-connect for faster Map loading -->
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://maps.gstatic.com">
</head>

<body
  class="bg-background-dark text-white font-display overflow-hidden h-screen supports-[height:100dvh]:h-[100dvh] w-screen flex">
  <div id="root" class="h-full w-full flex"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
            console.log('SW unregistered on localhost');
          }
        });
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    }
  </script>
</body>

</html>
