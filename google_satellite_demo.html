<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Style - Network Monitor Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Satellite Mode Palette */
            --s-bg: #0b1622;
            --s-text: #ffffff;
            --s-marker-up: #43a047;
            --s-marker-down: #d32f2f;
            --s-marker-odp: #ffa000;
            --s-marker-pppoe: #1976d2;
            --s-glow: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #111;
            color: var(--s-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            color: #ccc;
            font-size: 0.9rem;
        }

        .map-container {
            /* Background simulated satellite texture */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                #0b1622;
            width: 1000px;
            height: 600px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Topographic/Grid effect */
        .map-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* High Visibility Animated Lines */
        .line-wrapper {
            position: absolute;
            transform-origin: left center;
            height: 4px;
            z-index: 1;
        }

        .line-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .line-flow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    currentColor 20%,
                    currentColor 80%,
                    transparent);
            border-radius: 10px;
            filter: drop-shadow(0 0 8px currentColor);
            animation: flow 3s infinite linear;
        }

        @keyframes flow {
            0% {
                clip-path: inset(0 100% 0 0);
            }

            50% {
                clip-path: inset(0 0 0 0);
            }

            100% {
                clip-path: inset(0 0 0 100%);
            }
        }

        /* Status Colors for Lines */
        .color-up {
            color: var(--s-marker-up);
        }

        .color-down {
            color: var(--s-marker-down);
        }

        .color-odp {
            color: var(--s-marker-odp);
        }

        .color-pppoe {
            color: var(--s-marker-pppoe);
        }

        /* Satellite Markers */
        .marker {
            position: absolute;
            width: 44px;
            height: 44px;
            z-index: 5;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .marker:hover {
            transform: scale(1.1);
        }

        .marker-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .marker-inner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 15px currentColor;
        }

        .marker-label {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Layout */
        #site-main {
            left: 150px;
            top: 280px;
        }

        #site-a {
            left: 450px;
            top: 150px;
        }

        #site-b {
            left: 450px;
            top: 400px;
        }

        #client-1 {
            left: 750px;
            top: 280px;
        }

        /* UI Panel overlay */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(32, 33, 36, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
            width: 200px;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 5px currentColor;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Google Maps Satellite Style</h1>
        <p>Gaya tampilan satelit dengan garis animasi aliran data (Flow Animation).</p>
    </div>

    <div class="map-container">
        <div class="map-grid"></div>

        <div class="ui-panel">
            <h3 style="margin: 0 0 15px 0; font-size: 1rem;">Status Map</h3>
            <div class="legend">
                <div class="legend-item color-up">
                    <div class="circle" style="background: currentColor;"></div> Koneksi Utama (Up)
                </div>
                <div class="legend-item color-down">
                    <div class="circle" style="background: currentColor;"></div> Terputus (Down)
                </div>
                <div class="legend-item color-odp">
                    <div class="circle" style="background: currentColor;"></div> Jalur ODP
                </div>
                <div class="legend-item color-pppoe">
                    <div class="circle" style="background: currentColor;"></div> Jalur PPPoE
                </div>
            </div>
        </div>

        <!-- Animated Lines -->
        <!-- Center to Top -->
        <div class="line-wrapper color-up" style="width: 320px; left: 172px; top: 300px; transform: rotate(-25deg);">
            <div class="line-base"></div>
            <div class="line-flow"></div>
        </div>
        <!-- Center to Bottom -->
        <div class="line-wrapper color-odp" style="width: 320px; left: 172px; top: 300px; transform: rotate(25deg);">
            <div class="line-base"></div>
            <div class="line-flow" style="animation-duration: 2s;"></div>
        </div>
        <!-- Top to Right -->
        <div class="line-wrapper color-pppoe" style="width: 320px; left: 472px; top: 170px; transform: rotate(25deg);">
            <div class="line-base"></div>
            <div class="line-flow"></div>
        </div>
        <!-- Bottom to Right (Down) -->
        <div class="line-wrapper color-down"
            style="width: 320px; left: 472px; top: 420px; transform: rotate(-25deg); color: #d32f2f;">
            <div class="line-base"></div>
            <!-- No flow for down -->
        </div>

        <!-- Markers -->
        <div class="marker color-up" id="site-main">
            <div class="marker-icon">
                <div class="marker-inner"></div>
            </div>
            <div class="marker-label">Core Router</div>
        </div>

        <div class="marker color-up" id="site-a">
            <div class="marker-icon">
                <div class="marker-inner"></div>
            </div>
            <div class="marker-label">Sektor Utara</div>
        </div>

        <div class="marker color-odp" id="site-b">
            <div class="marker-icon">
                <div class="marker-inner"></div>
            </div>
            <div class="marker-label">ODP Area 2</div>
        </div>

        <div class="marker color-pppoe" id="client-1">
            <div class="marker-icon">
                <div class="marker-inner"></div>
            </div>
            <div class="marker-label">Client Premium</div>
        </div>

    </div>

</body>

</html>
