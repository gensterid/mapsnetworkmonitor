version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mikrotik-monitor-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mikrotik_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitor-network

  redis:
    image: redis:7-alpine
    container_name: mikrotik-monitor-redis
    restart: always
    networks:
      - monitor-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mikrotik-monitor-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-mikrotik_monitor}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - db
      - redis
    networks:
      - monitor-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mikrotik-monitor-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  postgres_data:
