version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mikrotik-monitor-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mikrotik_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mikrotik_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mikrotik-monitor-redis
    restart: always
    # PENTING: Set REDIS_PASSWORD di .env sebelum apply perubahan ini
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mikrotik-monitor-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-mikrotik_monitor}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mikrotik-monitor-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mikrotik-monitor-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    # Hanya aksesibel dari host Proxmox — gunakan SSH tunnel untuk akses dari luar
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitor-network

  grafana:
    image: grafana/grafana:latest
    container_name: mikrotik-monitor-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    # Hanya aksesibel dari host Proxmox — gunakan SSH tunnel untuk akses dari luar
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitor-network

  loki:
    image: grafana/loki:latest
    container_name: mikrotik-monitor-loki
    restart: always
    # Hanya aksesibel dari host Proxmox
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitor-network

  promtail:
    image: grafana/promtail:latest
    container_name: mikrotik-monitor-promtail
    restart: always
    volumes:
      - /var/log:/var/log
      - ./scripts/logging/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
