version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mikrotik-monitor-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mikrotik_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitor-network

  redis:
    image: redis:7-alpine
    container_name: mikrotik-monitor-redis
    restart: always
    networks:
      - monitor-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mikrotik-monitor-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-mikrotik_monitor}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - db
      - redis
    networks:
      - monitor-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mikrotik-monitor-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - monitor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mikrotik-monitor-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitor-network

  grafana:
    image: grafana/grafana:latest
    container_name: mikrotik-monitor-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
